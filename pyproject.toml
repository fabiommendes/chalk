[project]
name = "chalk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "errorz>=0.2.1",
    "frozendict>=2.4.7",
    "gitignore-lib>=0.1.1",
    "mdq>=0.1.0",
    "natsort>=8.4.0",
    "optionz>=0.2.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer",
]

[project.scripts]
chalk = "chalk.__main__:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
enable_incomplete_feature = ["TypeForm"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.30.0",
    "mypy>=2.1.0",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "taskipy>=1.14.1",
    "types-pygments>=2.20.0.20260518",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.taskipy.tasks]
docs = { cmd = "uv run mkdocs build", help = "Build HTML documentation" }
docs-serve = { cmd = "uv run mkdocs serve", help = "Serve HTML documentation with live reload" }
test = "pytest tests"
lint = "ruff check ."
check = { cmd = "ruff check . && pytest -q tests && mkdocs build --strict -q", help = "Lint, tests and docs: run before every commit" }
build = "uv build"
cli-docs = { cmd = "typer chalk.cli utils docs --name chalk --title \"Command reference\" --output docs/user-manual/cli.md", help = "Regenerate docs/user-manual/cli.md from the CLI" }

[tool.uv.build-backend]
module-name = "chalk"
module-root = "."

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E731", # do not assign a lambda expression, use a def
    "B008", # typer declares options as function calls in defaults
    "B905", # zip() without strict=
    "B904", # raise ... from inside except
    "B007", # unused loop variables
    "E501", # long lines are left to the formatter
]

[tool.uv.sources]
mdq = { path = "../../codehood/mdq/mdq-py", editable = true }
