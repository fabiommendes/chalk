[project]
name = "chalk-grader"
version = "0.2.0"
description = "Grade code answers in a sandbox with data profiles (pytest, cargo, elm-test, plunit...)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education :: Testing",
]
dependencies = [
    "gitignore-lib>=0.1.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/fabiommendes/chalk"
Source = "https://github.com/fabiommendes/chalk/tree/main/packages/chalk-grader"
Issues = "https://github.com/fabiommendes/chalk/issues"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chalk_grader"
module-root = "."
source-exclude = [".claude", "tests"]
wheel-exclude = [".claude"]
