# r2: adr-0003
# Built-in autograder profiles. A [profiles.<name>] table in chalk.toml
# with the same keys adds a profile, or changes one of these with
# `extends = "<name>"`. The keys are documented in
# docs/user-manual/autograding-scripts.md.
#
# Variables in braces: {cache}, {template}, {workdir}, {tests}, {PATH} and
# the probes of the profile. Commands get them shell-quoted.
#
# Limits. {jobs} is how many threads or processes a profile runs at once:
# 1 by default, since a grader may grade one answer per core. {memory_mib}
# is the memory of a run, in MiB, from `limits.memory` or the profile's
# default `vars.memory_mib`. It is the memory limit of the cgroup of each
# run, when the grader has cgroups (see cgroup.py). Some profiles also turn
# it into a limit their runtime understands (the heap of Node, the stacks of
# swipl), which is all there is without cgroups. None turns it into
# `ulimit -v`: address space is not memory, and torch, Node, the JVM and
# threaded libraries reserve far more of it than they use.

[python-pytest]
description = "Python project tested with pytest, dependencies from uv.lock"
key = ["pyproject.toml", "uv.lock"]
# Every file pytest reads its configuration from comes from the template.
# sitecustomize.py would run before pytest.
trusted = [
    "conftest.py", "pytest.ini", "pyproject.toml", "tox.ini", "setup.cfg",
    "sitecustomize.py", "usercustomize.py", "src/sitecustomize.py", "src/usercustomize.py",
]
readable = ["{cache}", "{python}", "{runners}"]
# Plugins are not loaded automatically: the student could add a dist-info
# with a pytest11 entry point. The template's conftest.py loads the plugins
# it needs with `pytest_plugins`. {runners} has pytest_guard, the plugin
# that stops the code under test from rewriting the report.
env.PYTHONPATH = "{runners}:{workdir}/src:{workdir}"
env.PYTHONDONTWRITEBYTECODE = "1"
env.PYTHONHASHSEED = "0"
env.PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
env.UV_PROJECT_ENVIRONMENT = "{cache}/venv"
env.CHALK_GUARD = "{guard}"
env.CHALK_GUARD_TRUSTED = "{tests}"
env.OMP_NUM_THREADS = "{jobs}"
env.OPENBLAS_NUM_THREADS = "{jobs}"
# Each thread of glibc's malloc may get an arena of its own, which reserves
# up to 64 MiB of address space and keeps freed memory.
env.MALLOC_ARENA_MAX = "2"
unset = ["PYTHONHOME"]
vars.guard = "on"               # off: code under test may run subprocesses and ctypes
vars.jobs = "1"
# Memory of the run with a cgroup. Measured: up to 269 MiB for the tests of
# a question with pandas, 382 MiB for its prepare step.
vars.memory_mib = "1024"
# Python installations of uv, hidden in the home directory.
probe.python = "uv python dir"
prepare.commands = ["uv sync --frozen --no-install-project"]
test.command = """\
{cache}/venv/bin/python -m pytest --rootdir {workdir} -p no:cacheprovider -p pytest_guard \
--junit-xml "$CHALK_RESULT" {tests}"""

[python-pytest.suspicious."**/*.py"]
"registers exit handlers" = '\batexit\b'
"exits without cleanup" = 'os\._exit'
"changes loaded modules" = 'sys\.modules'
"runs code from strings" = '(?<![\w.])(exec|eval|compile)\s*\('
"imports modules dynamically" = '__import__|\bimportlib\b'
"uses ctypes" = '\bctypes\b'
"decodes base64" = '\bbase64\b|b64decode'
"inspects live objects" = '\bgc\.get_(objects|referrers|referents)\b'
"walks stack frames" = 'sys\._getframe|\binspect\.(currentframe|stack)\b'
"refers to pytest internals" = '\b_pytest\b|\bpytest_\w+'
"adds audit hooks" = '\baddaudithook\b'

[rust-cargo]
description = "Rust crate tested with cargo nextest, dependencies from Cargo.lock"
key = ["Cargo.toml", "Cargo.lock"]
trusted = ["Cargo.toml", "Cargo.lock", ".cargo", ".config"]
readable = ["{cache}", "{sysroot}", "{nextest}"]
# The sandbox runs the toolchain binaries directly: the rustup proxies need
# the rustup home, which is hidden. CARGO_HOME is in the cache, apart from
# the teacher's, which holds the crates.io token.
env.CARGO_HOME = "{cache}/home"
env.RUSTC = "{sysroot}/bin/rustc"
env.PATH = "{sysroot}/bin:{nextest}:{PATH}"
env.CARGO_TERM_COLOR = "never"
unset = ["CARGO_TARGET_DIR"]
probe.sysroot = "rustc --print sysroot"
probe.nextest = 'p=$(command -v cargo-nextest) && dirname "$p"'
probe.rustc = "rustc -vV"
# Only the cgroup limits memory: threads reserve far more address space than
# they use. The budget includes the build.
vars.jobs = "1"
vars.memory_mib = "2048"
files."nextest.toml" = """
[profile.chalk]
fail-fast = false

[profile.chalk.junit]
path = "junit.xml"
"""
# The target directory of the reference solution: each student starts from
# a copy, so only the student's crate compiles.
prepare.commands = [
    "cargo fetch --locked",
    "cargo build --tests --offline --locked --target-dir {cache}/target",
]
build.seed = { target = "{cache}/target" }
build.command = "cargo build --tests --offline --locked --jobs {jobs}"
build.timeout = 120
# Only integration tests (the tests/ directory) count.
test.command = """\
cargo nextest run --offline --locked --profile chalk --test-threads {jobs} \
--config-file {cache}/nextest.toml -E 'kind(test)'; \
cp target/nextest/chalk/junit.xml "$CHALK_RESULT\""""

[c-make]
description = "C project built by the template's Makefile, tested with chalk_test.h"
key = ["Makefile"]
trusted = ["Makefile"]
readable = ["{cache}", "{runners}"]
# The Makefile builds the test program {binary} with $(CFLAGS) and
# $(LDFLAGS). chalk_test.h is in the include path.
vars.binary = "run_tests"
vars.test_timeout = "5"         # seconds per test
env.CHALK_TEST_TIMEOUT = "{test_timeout}"
env.CFLAGS = "-O0 -g -Wall -fno-omit-frame-pointer -fsanitize=address,undefined -I{runners}"
env.LDFLAGS = "-fsanitize=address,undefined"
# Leak checks need ptrace, which the sandbox does not allow; undefined
# behavior fails the test instead of printing a warning.
# Only the cgroup limits memory: AddressSanitizer reserves terabytes of
# address space, and its own RSS limit does not reach the process of each
# test. Its quarantine of freed memory takes up to 256 MiB.
vars.memory_mib = "1024"
env.ASAN_OPTIONS = "detect_leaks=0"
env.UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
build.command = "make {binary}"
build.timeout = 60
test.command = "./{binary}"

[stdio]
description = "Program run with each tests/*.in on stdin, compared with the .out files"
readable = ["{cache}", "{runners}"]
report = "stdio"
# The expected outputs never reach the sandbox: chalk compares them.
hide = ["**/*.out"]
vars.run = "./main"
vars.compare = "lines"          # exact | lines | tokens
vars.test_timeout = "5"         # seconds per case
# Memory of the run with a cgroup: the program and the runner. Measured:
# 16 MiB for a C program, 48 MiB for a Python one.
vars.memory_mib = "512"
env.MALLOC_ARENA_MAX = "2"
test.command = """\
{python} -I {runners}/stdio.py --report "$CHALK_RESULT" --timeout {test_timeout} \
--command {run} {tests}"""

[c-stdio]
extends = "stdio"
description = "C program compiled with cc, run with each tests/*.in on stdin"
vars.cflags = "-O2 -Wall"
build.command = "cc $CFLAGS -o main *.c -lm"
env.CFLAGS = "{cflags}"

[elm-test]
description = "Elm application tested with elm-test, packages from elm.json"
key = ["elm.json"]
# elm-stuff from the student could carry compiled modules.
trusted = ["elm.json", "elm-stuff"]
readable = ["{cache}", "{node_dir}", "{elm_test_dir}", "{elm_dir}"]
# Elm writes a lock file in ELM_HOME even to read packages, so each run gets
# a copy of the packages the prepare step downloaded.
env.ELM_HOME = "{workdir}/.elm-home"
env.PATH = "{node_dir}/bin:{PATH}"
# The heap of each node isolate. The compiler, node itself and the files of
# the run take about 110 MiB more, so with a cgroup an answer that allocates
# without end goes past the memory of the run first and gets memory-limit.
# elm-test runs {jobs} workers, each with a heap of its own; before
# 0.19.2 it has no --workers and runs one per core.
env.NODE_OPTIONS = "--max-old-space-size={memory_mib}"
vars.jobs = "1"
vars.memory_mib = "512"
probe.node = 'p=$(command -v node) && readlink -f "$p"'
probe.node_dir = 'p=$(command -v node) && dirname "$(dirname "$(readlink -f "$p")")"'
probe.elm_test = 'p=$(command -v elm-test) && readlink -f "$p"'
probe.elm_test_dir = 'p=$(command -v elm-test) && dirname "$(dirname "$(readlink -f "$p")")"'
probe.elm = 'p=$(command -v elm) && readlink -f "$p"'
probe.elm_test_workers = 'elm-test --help 2>&1 | grep -q -- --workers && echo yes || echo no'
probe.elm_dir = 'p=$(command -v elm) && dirname "$(readlink -f "$p")"'
probe.version = "elm --version"
prepare.commands = [
    "{node} {elm_test} make --compiler {elm}",
    "cp -a {workdir}/.elm-home {cache}/elm",
]
build.seed = { ".elm-home" = "{cache}/elm" }
build.command = "{node} {elm_test} make --compiler {elm}"
build.timeout = 120
test.command = """\
w=; if [ {elm_test_workers} = yes ]; then w="--workers {jobs}"; fi; \
{node} {elm_test} --compiler {elm} --seed 1 $w --report junit > "$CHALK_RESULT\""""

[prolog-plunit]
description = "Prolog program tested with plunit, one swipl process per test"
tests = ["tests.pl"]
readable = ["{cache}", "{runners}", "{swipl_home}"]
probe.swipl = "command -v swipl"
probe.swipl_home = '''swipl -g "current_prolog_flag(home, H), writeln(H)" -t halt'''
# on: the program is read before anything runs, and every clause body and
# directive must pass safe_goal/1 of library(sandbox). What is refused is a
# build error, listed in the notes and not in the feedback. off: the program
# may do I/O, and halt/0 only ends its own test.
vars.safe = "on"
vars.test_timeout = "5"         # seconds per test
vars.memory_mib = "512"         # each swipl process: its stacks get 5/8 of it
build.command = """\
{swipl} -q -f none {runners}/prolog_plunit.pl -- check {safe} "$CHALK_ANSWER\""""
build.timeout = 60
test.command = """\
{python} -I {runners}/prolog_plunit.py --swipl {swipl} --answer "$CHALK_ANSWER" \
--report "$CHALK_RESULT" --timeout {test_timeout} --memory {memory_mib} {tests}"""
