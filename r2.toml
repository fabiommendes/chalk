# r2 watches this project because this file is here.
# Delete the file to stop.

[web]
# name = "a better name than the directory"

# The robot r2 web draws for this project's agents; picked from the
# project's path when unset.
# [web.robot]
# body = "astromech"            # astromech, boxbot, ball, hal, bmo, cyclops
# colors = ["blue", "yellow"]   # blue, red, purple, yellow, green, grey

[commands.check]
run = "uv run task check"
help = "Ruff, pytest and mkdocs --strict: the change is done when this passes."

[commands.test]
run = "uv run pytest -q tests packages/chalk-grader/tests"
help = "Run the test suites of chalk and chalk-grader."
